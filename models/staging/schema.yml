version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key

